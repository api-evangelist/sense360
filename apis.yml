description: Sense360 provides modular ESPHome sensor kits for Home Assistant, offering PoE-powered bathroom and room sensing solutions. Their
  products include the Sense360 Core hub, RoomIQ for presence, temperature, humidity, and light detection, and VentIQ for bathroom air quality
  monitoring. Designed for easy integration, the kits enable smart home automations that respond to environmental conditions, improving comfort
  and energy efficiency.

